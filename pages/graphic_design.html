    <script type="module">
      import Swiper from 'https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.mjs';

      async function loadHtml(url){
        try {
          const res = await fetch(url, {cache: "no-store"});
          if (!res.ok) return "";
          return await res.text();
        } catch(e) { return ""; }
      }

      async function insertIncludes(){
        // 1. Inyectar Header
        const headerHolder = document.getElementById("include-header");
        if (headerHolder) headerHolder.innerHTML = await loadHtml("includes/header.html");

        // 2. Inyectar Footer
        const footerHolder = document.getElementById("include-footer");
        if (footerHolder) footerHolder.innerHTML = await loadHtml("includes/footer.html");

        // 3. Inyectar Scripts de includes/scripts.html
        try {
          const scriptsText = await loadHtml("includes/scripts.html");
          const doc = new DOMParser().parseFromString(scriptsText, "text/html");
          const scripts = Array.from(doc.querySelectorAll("script"));
          for (const s of scripts){
            await new Promise((resolve) => {
              const sc = document.createElement("script");
              if (s.src) {
                const srcAttr = s.getAttribute ? s.getAttribute("src") : s.src;
                let resolvedSrc = srcAttr;
                try { resolvedSrc = new URL(srcAttr, document.baseURI).href; } catch(e) {}
                sc.src = resolvedSrc;
                sc.async = false;
                sc.onload = resolve;
                document.body.appendChild(sc);
              } else {
                sc.textContent = s.textContent;
                document.body.appendChild(sc);
                resolve();
              }
            });
          }
        } catch(e){ console.error("Error loading scripts", e); }

        // 4. Inicializar Swiper solo en las páginas que tengan carrusel
        initSwiper();
      }

      function initSwiper() {
        if (document.querySelector(".mySwiper") && typeof Swiper !== "undefined") {
          new Swiper(".mySwiper", {
            autoplay: false,
            slidesPerView: 1.2,
            spaceBetween: 10,
            centeredSlides: false,
            breakpoints: {
                640: { slidesPerView: 2.2 },
                1024: { slidesPerView: 4 }
            },
            loop: true,
            a11y: false,
            preventClicksPropagation: false,
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
          });
        }
      }

      // Ejecución al cargar el DOM
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", insertIncludes);
      } else {
        insertIncludes();
      }
    </script>
