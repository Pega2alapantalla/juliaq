<!-- Librerías de Terceros -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/includes/ui-6.1.13/dist/fancybox/fancybox.umd.js"></script>

<script>
// 1. LÓGICA DE FILTROS CON ANIMACIÓN FADE/COLLAPSE
function initGalleryFilters() {
  const filterButtons = document.querySelectorAll('.illustration-categories .nav-item, [data-filter]');
  const galleryItems = document.querySelectorAll('#gallery .gallery-item, .gallery-item');

  if (filterButtons.length === 0 || galleryItems.length === 0) return;

  function collapseAfterFade(item){
    const onEnd = (e) => {
      if (e.propertyName === 'opacity'){
        item.classList.add('collapsed');
        item.removeEventListener('transitionend', onEnd);
      }
    };
    item.addEventListener('transitionend', onEnd);
  }

  function showItem(item){
    item.classList.remove('collapsed');
    void item.offsetWidth; // Force reflow para reaplicar transiciones CSS
    item.classList.remove('hidden');
  }

  function hideItem(item){
    if (!item.classList.contains('hidden')){
      item.classList.add('hidden');
      collapseAfterFade(item);
    }
  }

  filterButtons.forEach(button => {
    button.addEventListener('click', (e) => {
      e.preventDefault();
      const filter = button.getAttribute('data-filter');
      
      filterButtons.forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');

      galleryItems.forEach(item => {
        const itemCategory = item.getAttribute('data-category');
        if (filter === 'all' || filter === '*' || itemCategory === filter) {
          showItem(item);
        } else {
          hideItem(item);
        }
      });
    });
  });
}

// 2. INICIALIZACIÓN DE FANCYBOX
function initFancybox() {
  if (window.Fancybox) {
    Fancybox.bind('[data-fancybox]', {
      mainClass: "fancybox-with-margin",
      Images: {
        fit: "contain",
        maxScale: 500,
      },
      Toolbar: {
        display: {
          left: [],
          middle: [],
          right: ["iterateZoom", "close"]
        }
      },
      Panzoom: {
        maxScale: 500
      },
      dragToClose: false,
      Thumbs: {
        autoStart: false
      }
    });
  }
}

// Ejecutar al cargar la página
initFancybox();
initGalleryFilters();

// 3. ANIMACIÓN FADE-IN AL SCROLL
const faders = document.querySelectorAll('.fade-in');
if (faders.length > 0) {
    const appearOptions = { threshold: 0.1 };
    const appearOnScroll = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                observer.unobserve(entry.target);
            }
        });
    }, appearOptions);

    faders.forEach(fader => appearOnScroll.observe(fader));
}

// 4. MENÚ NAVEGACIÓN Y DROPDOWNS
const navbar = document.getElementById('navbar');
const openItems = new Set();

function refreshNavbarState() {
    if (!navbar) return;
    if (openItems.size > 0) {
        navbar.classList.add('dropdown-open');
    } else {
        navbar.classList.remove('dropdown-open');
    }
}

function closeAllDropdowns() {
    document.querySelectorAll('.nav-item.dropdown').forEach(otherItem => {
        otherItem.classList.remove('open');
    });
    openItems.clear();
    refreshNavbarState();
}

if (window.matchMedia('(min-width: 769px)').matches) {
    document.querySelectorAll('.nav-item.dropdown').forEach(item => {
        item.addEventListener('mouseenter', () => {
            item.classList.add('open');
            openItems.add(item);
            refreshNavbarState();
        });
        item.addEventListener('mouseleave', () => {
            item.classList.remove('open');
            openItems.delete(item);
            refreshNavbarState();
        });
    });
}

window.addEventListener('resize', closeAllDropdowns);

const hamburger = document.getElementById('hamburger');
if (hamburger && navbar) {
    hamburger.addEventListener('click', () => {
        const isOpen = navbar.classList.toggle('open');
        document.body.classList.toggle('nav-open', isOpen);
        hamburger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
}

document.querySelectorAll('.dropdown-toggle').forEach(button => {
    button.addEventListener('click', (e) => {
        e.preventDefault();
        const item = button.parentElement;
        const isOpen = item.classList.contains('open');

        document.querySelectorAll('.nav-item.dropdown').forEach(otherItem => {
            otherItem.classList.remove('open');
        });

        if (!isOpen) {
            item.classList.add('open');
        }
    });
});

// 5. FIJAR Y ENCOGER HEADER AL SCROLL
(function(){
    function enableFixedHeader(){
        const includeHolder = document.getElementById('include-header');
        const header = includeHolder ? includeHolder.querySelector('header.site-header') : document.querySelector('header.site-header');
        if (!header) return;

        header.classList.add('is-fixed');

        function updatePlaceholder(){
            let ph = document.getElementById('header-placeholder');
            if (!ph){
                ph = document.createElement('div');
                ph.id = 'header-placeholder';
                header.parentNode.insertBefore(ph, header.nextSibling);
            }
            const h = header.getBoundingClientRect().height;
            ph.style.height = h + 'px';
        }

        updatePlaceholder();
        window.addEventListener('resize', updatePlaceholder, {passive:true});
        if (window.ResizeObserver) {
            const ro = new ResizeObserver(updatePlaceholder);
            ro.observe(header);
        }
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', enableFixedHeader); else enableFixedHeader();
})();

(function(){
    const THRESHOLD = 48;
    let ticking = false;

    function update() {
        ticking = false;
        const header = document.querySelector('header.site-header');
        const navMenu = header ? header.querySelector('.nav-menu') : null;
        if (!header) return;
        const sc = window.scrollY || window.pageYOffset;
        if (sc > THRESHOLD) {
            header.classList.add('shrink');
            if (navMenu) navMenu.classList.add('shrink');
        } else {
            header.classList.remove('shrink');
            if (navMenu) navMenu.classList.remove('shrink');
        }
    }

    function onScroll(){
        if (!ticking){
            ticking = true;
            window.requestAnimationFrame(update);
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            window.addEventListener('scroll', onScroll, {passive:true});
            update();
        });
    } else {
        window.addEventListener('scroll', onScroll, {passive:true});
        update();
    }
})();


// CONTROL DE VÍDEOS AL PASAR EL RATÓN (HOVER)
function initHoverVideos() {
  // Usamos delegación de eventos en el document para que funcione siempre
  document.addEventListener('mouseover', (e) => {
  const link = e.target.closest('.fancybox-video-link');
  if (link) {
    const video = link.querySelector('video');
    if (video) video.play().catch(() => {});
  }
});

document.addEventListener('mouseout', (e) => {
  const link = e.target.closest('.fancybox-video-link');
  if (link) {
    const video = link.querySelector('video');
    if (video) video.pause();
  }
});
}

// Inicializar control de vídeos
initHoverVideos();
</script>
